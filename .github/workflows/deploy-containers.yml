name: Deploy Containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'

jobs:
  detect-changes:
    name: Detect Changed Containers
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.changes.outputs.containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed container directories
        id: changes
        run: |
          # Find which container directories have changes
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- containers/ \
            | cut -d'/' -f2 \
            | sort -u \
            | grep -v '^_base$' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "containers=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed containers: $CHANGED"

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.containers != '[]'
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-changes.outputs.containers) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and deploy container
        run: |
          cd containers/${{ matrix.container }}
          echo "Building and deploying ${{ matrix.container }}..."

          # If there is a fly.toml, deploy directly
          if [ -f fly.toml ]; then
            flyctl deploy --remote-only
          else
            # Build the image and push to fly.io registry
            APP_NAME="${FLY_APP_PREFIX}-${{ matrix.container }}"
            flyctl apps create "$APP_NAME" --org personal 2>/dev/null || true
            flyctl deploy --remote-only --app "$APP_NAME" \
              --build-arg LITELLM_PROXY_URL="$LITELLM_PROXY_URL"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_PREFIX: ${{ secrets.FLY_APP_PREFIX }}
          LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
